# Cloudflare Workers — MF SMC Trader
# Deploy karne ke liye: bun run deploy:cloudflare
# Docs: https://developers.cloudflare.com/workers/

name = "mf-smc-trader"
main = ".output/server/index.mjs"
compatibility_date = "2025-01-01"

# nodejs_compat: process.env, crypto, URL, Buffer etc. enable karta hai
compatibility_flags = ["nodejs_compat"]

# Static assets (JS bundles, CSS, images) Worker ke sath serve honge
[assets]
directory = ".output/public"
binding = "ASSETS"

# ─── Environment Variables ─────────────────────────────────────────────────────
# Sensitive values (API keys) KABHI yahan mat likho.
# Inhe `wrangler secret put` command se set karo — niche deployment guide dekho.
#
# Public (non-secret) values yahan rakh sakte ho:
# [vars]
# SOME_PUBLIC_VAR = "value"

# ─── Wrangler Secrets (run once, then wrangler stores them securely) ───────────
# wrangler secret put TWELVEDATA_API_KEY
# wrangler secret put SESSION_SECRET
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_PUBLISHABLE_KEY
# wrangler secret put SUPABASE_PROJECT_ID
# wrangler secret put VITE_SUPABASE_URL
# wrangler secret put VITE_SUPABASE_PUBLISHABLE_KEY
# wrangler secret put VITE_SUPABASE_PROJECT_ID
